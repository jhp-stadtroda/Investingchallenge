const sum = values => values.reduce((total, value) => total + value, 0);
const zeroHoldings = () => Object.fromEntries(ASSETS.map(asset => [asset.id, 0]));
function trackTrades(holdings, costBasis, trades) {
  const nextBasis = {...costBasis};
  const results = trades.map(trade => {
    if (trade.delta > 0) {
      nextBasis[trade.id] += trade.delta + trade.fee;
      return {...trade};
    }
    const sold = -trade.delta;
    const fraction = Math.min(1, sold / holdings[trade.id]);
    const soldBasis = nextBasis[trade.id] * fraction;
    const realizedGain = sold - trade.fee - soldBasis;
    nextBasis[trade.id] = Math.max(0, nextBasis[trade.id] - soldBasis);
    return {...trade, soldBasis, realizedGain, realizedReturn:soldBasis > 0 ? realizedGain / soldBasis : null};
  });
  return {costBasis:nextBasis, trades:results};
}
function restoreCostBasis(saved) {
  let basis = zeroHoldings();
  if (saved.initial) {
    basis = trackTrades(zeroHoldings(), basis, saved.initial.trades).costBasis;
    let previous = saved.initial.holdings;
    for (const entry of saved.history) {
      const execution = trackTrades(previous, basis, entry.trades);
      basis = execution.costBasis;
      entry.trades = execution.trades;
      previous = entry.holdings;
    }
  }
  saved.costBasis = basis;
}
function quoteTrade(holdings, targets, cashflow = 0) {
  const next = {...holdings};
  const trades = [];
  let cash = holdings.cash + cashflow;
  let fees = 0;
  for (const asset of ASSETS.slice(1)) {
    const target = targets[asset.id];
    if (!Number.isFinite(target) || target < 0) return {valid:false, error:'Ungültiger Zielbetrag.'};
    const delta = target - holdings[asset.id];
    if (Math.abs(delta) < 0.000001) continue;
    const fee = asset.id === 'fixed' ? (delta < 0 ? 50 : 0) :
      asset.id === 'gold' ? Math.abs(delta) * asset.fee : asset.fee;
    fees += fee;
    cash -= delta + fee;
    next[asset.id] = target;
    trades.push({id:asset.id, delta, fee});
  }
  next.cash = cash;
  return {valid:cash >= -0.0000001, holdings:next, fees, trades,
    error:cash < -0.0000001 ? 'Bargeld reicht für Käufe, Gebühren und die fällige Ausgabe nicht aus.' : ''};
}

  {date:'2025-11-19',category:'Technologie · KI',title:'Nvidia meldet Rekordumsatz',text:'Nvidia meldet für sein drittes Geschäftsquartal 57 Milliarden US-Dollar Umsatz, 62 % mehr als ein Jahr zuvor. Ein großer Teil kommt aus Rechenzentren. Der Ausbau künstlicher Intelligenz kostet weltweit viel Geld.',figure:'+62 %',caption:'Umsatz gegenüber dem Vorjahresquartal. Umsatzwachstum ist nicht dasselbe wie Aktienrendite.',focus:'nvidia',question:'Würdest du nach guten Geschäftszahlen mehr Nvidia kaufen oder sind die Erwartungen schon im Kurs?',lesson:'Im Dezember steigt Nvidia. Trotzdem gilt: Gemeldeter Umsatz und Aktienkurs sind verschiedene Größen. Erwartungen, Bewertung und weitere Nachrichten entscheiden mit.',source:'Nvidia, Quartalsmeldung vom 19.11.2025',url:NVIDIA('third-quarter-fiscal-2026')},
  {date:'2025-12-05',category:'Wirtschaft · Stimmung',title:'Ein unauffälliger Start in den Januar',text:'Zum Monatsbeginn gibt es keine große Zentralbankentscheidung und keine auffälligen Unternehmenszahlen. Die Wirtschaftsnachrichten wirken ruhig, viele Anlegerinnen und Anleger gehen entspannt in das neue Jahr.',figure:'Keine Schlagzeile',caption:'Eine ruhige Nachrichtenlage zu Monatsbeginn sagt nichts darüber, was im Monatsverlauf noch passiert.',focus:'oil',question:'Bedeutet eine ruhige Nachrichtenlage automatisch ruhige Kursverläufe?',lesson:'Im Januar kommt es u.a. durch Proteste im Iran zu schnell ansteigenden Preisen an den Energie- und Rohstoffmärkten: Öl und Gold stiegen innerhalb weniger Tage deutlich. Weder die ruhige Nachricht vom Monatsanfang noch sonst irgendjemand konnte das vorhersehen. Genau solche unerwarteten Ereignisse sind an echten Finanzmärkten jederzeit möglich.'},
  {date:'2026-01-28',category:'Unternehmen · Tesla',title:'Tesla legt seine Jahreszahlen vor',text:'Tesla veröffentlicht die Ergebnisse des vierten Quartals und des Gesamtjahres 2025 und lädt zur Fragerunde über Zahlen und Ausblick ein. Für Anleger zählt nicht nur das vergangene Geschäft: Auch Erwartungen an künftige Produkte und Gewinne stehen auf dem Prüfstand.',figure:'Q4 / 2025',caption:'Ein Bericht über das abgelaufene Geschäftsjahr, keine Zusage über die künftige Kursentwicklung.',focus:'tesla',question:'Wie viel deines Geldes möchtest du vom Erfolg einer einzigen Firma abhängig machen?',lesson:'Tesla verliert im Februar. Aus dem Veröffentlichungsdatum allein lässt sich der Rückgang nicht erklären. Eine Einzelaktie bündelt Unternehmensrisiken stärker als ein breit gestreuter Fonds.',source:'Tesla Investor Relations, 28.01.2026',url:'https://ir.tesla.com/press-release/tesla-releases-fourth-quarter-and-full-year-2025-financial-results'},
  {date:'2026-02-28',category:'Weltpolitik · Energie',title:'Die Iran-Krise eskaliert',text:'Die USA und Israel greifen Iran an; Iran reagiert mit Gegenangriffen. Für die Menschen in der Region ist das eine schwere Krise. Zugleich ist unklar, wie sicher Öltransporte durch die Straße von Hormus bleiben. Steigende Energiepreise könnten Haushalte und Unternehmen weltweit belasten.',figure:'Öl & Risiko',caption:'Unsichere Transportwege können Energie verteuern. Ein Ölkonzern und der Ölpreis sind dennoch nicht identisch.',focus:'oil',question:'Wie könnten sich dieselben Ereignisse auf einen Ölkonzern, Gold und andere Aktien unterschiedlich auswirken?',lesson:'Im März steigt ExxonMobil, während Welt-ETF und Gold in Euro verlieren. Gold ist also nicht in jeder Krise ein sicherer Gewinner. Die Monatsrenditen enthalten viele Einflüsse, nicht nur die Eskalation.',source:'Associated Press / PBS, 28.02.2026',url:'https://www.pbs.org/newshour/world/live-updates-u-s-and-israel-attack-iran'},
  {date:'2026-04-01',category:'Dein Alltag · Liquidität',title:'Dein Fahrrad muss repariert werden',text:'Eine unerwartete Reparatur kostet 120 €. Die Rechnung ist sofort fällig. Bargeld genügt nicht? Dann musst du andere Anlagen verkaufen. Dabei fallen Verkaufsgebühren an; eine Entnahme aus Festgeld kostet zusätzlich pauschal 50 €.',figure:'−120 €',caption:'Erfundene Alltagssituation für das Planspiel. Die Börsenkurse dieses Monats bleiben historisch.',flow:-120,focus:'cash',question:'Welche Anlage verkaufst du und welche Kosten nimmst du dafür in Kauf?',lesson:'Die Reparatur ist Konsum, kein Börsenverlust. Trotzdem kann sie dich zu Verkäufen zu einem ungünstigen Zeitpunkt zwingen. Eine liquide Reserve kostet mögliche Rendite, schafft aber Handlungsfreiheit.'},
  {date:'2026-04-20',category:'Social Media · Finanzen',title:'Ein Finanz-Influencer verspricht die nächste Kursrally',text:'Ein reichweitenstarker Finanz-Influencer veröffentlicht ein Video mit einer klaren Prognose: Bitcoin werde in den kommenden Wochen deutlich steigen, weil immer mehr große Unternehmen Bitcoin in ihre Bilanz aufnehmen. Gold werde dagegen fallen, weil Anlegerinnen und Anleger ihr Geld lieber in Kryptowährungen statt in „altmodisches“ Gold steckten. Das Video wird tausendfach geteilt.',figure:'„Sicher“ prognostiziert',caption:'Eine Meinung mit vielen Klicks ist keine geprüfte Tatsache. Niemand kennt die Zukunft der Kurse im Voraus.',focus:'bitcoin',question:'Würdest du dein Geld nach einer Prognose aus den sozialen Medien umschichten?',lesson:'Die Prognose hat sich nur teilweise bestätigt: Gold ist tatsächlich gefallen, Bitcoin ist entgegen der Vorhersage ebenfalls gefallen statt zu steigen. Auch selbstbewusst vorgetragene Prognosen von Influencern sind keine verlässliche Grundlage für Anlageentscheidungen. Niemand kann Kurse sicher vorhersagen, auch nicht mit vielen Followern.'},
  {date:'2026-05-20',category:'Technologie · KI-Geschäft',title:'KI-Chips bleiben ein Milliardengeschäft',text:'Nvidia meldet 81,6 Milliarden US-Dollar Quartalsumsatz, 85 % mehr als ein Jahr zuvor. Besonders stark ist das Geschäft mit Rechenzentren. Viele Anleger setzen weiter auf die Nachfrage nach KI-Technik.',figure:'81,6 Mrd. $',caption:'Umsatz im gemeldeten Quartal. Auch eine erfolgreiche Firma kann an der Börse zu hoch bewertet sein.',focus:'nvidia',question:'Würdest du bei einer erfolgreichen Firma jede Bewertung akzeptieren?',lesson:'Nvidia verliert im Juni trotz der zuvor gemeldeten Rekordzahlen. Gute Nachrichten können bereits eingepreist sein; auch andere Faktoren bewegen Kurse. Das widerspricht der Regel „gute Nachricht = sicherer Gewinn“.',source:'Nvidia, Quartalsmeldung vom 20.05.2026',url:NVIDIA('first-quarter-fiscal-2027')},
  {date:'2026-07-01',category:'Dein Alltag · Einkommen',title:'120 Euro aus deinem Nebenjob',text:'Du hast 120 € verdient. Das Geld steht dir sofort als Bargeld zur Verfügung. Du kannst es als Reserve behalten, investieren oder zusammen mit deinem bisherigen Geld neu aufteilen.',figure:'+120 €',caption:'Das Geld für die Fahrradreparatur ist wieder drin. Ein höherer Kontostand durch Arbeit ist aber noch keine Anlagerendite.',flow:120,focus:'cash',question:'Brauchst du eher eine Reserve oder möchtest du das zusätzliche Geld langfristig anlegen?',lesson:'Dein Vermögen steigt durch Einkommen, nicht automatisch durch geschicktes Anlegen. Deshalb trennt die Auswertung Einzahlungen, Ausgaben, Gebühren und Marktgewinne.'},
  {date:'2026-07-15',category:'Wirtschaft · Handelsvolumen',title:'Sommerflaute an der Börse?',text:'Im Sommer sind viele Händlerinnen und Händler im Urlaub. Das Handelsvolumen an den Börsen sinkt in vielen Jahren im Juli und August. Analysten weisen darauf hin, dass bei geringerem Handel schon einzelne große Aufträge die Kurse stärker bewegen können als sonst.',figure:'Weniger Handel',caption:'Geringeres Handelsvolumen kann Kursausschläge verstärken. Es sagt aber nicht voraus, in welche Richtung die Kurse sich bewegen.',focus:'bitcoin',question:'Bedeutet ein ruhigerer Sommer an der Börse automatisch kleinere Kursschwankungen?',lesson:'Das Gegenteil trat ein: Bitcoin und Tesla legen im August deutlich zu. Eine Diskussion über das Handelsvolumen traf keine Aussage über die Richtung der Kurse. Weder Ruhe noch Trubel an der Börse lassen sich zuverlässig vorhersagen.'},
  {date:'2026-08-15',category:'Finanzbildung · Prognosen',title:'Expertinnen und Experten sind sich uneinig',text:'Kurz vor dem Ende des Börsenjahres veröffentlichen verschiedene Banken und Analysehäuser ihre Ausblicke. Manche erwarten weiter steigende Technologieaktien, andere warnen vor einer Korrektur. Manche setzen auf Gold als sicheren Hafen, andere erwarten fallende Goldpreise, weil sich die Lage beruhigt.',figure:'Viele Meinungen',caption:'Unterschiedliche Fachleute kommen zu entgegengesetzten Einschätzungen. Das zeigt: Niemand kennt die Zukunft der Kurse mit Sicherheit.',focus:'gold',question:'Welcher Expertenmeinung würdest du vertrauen – und warum wäre das riskant?',lesson:'Im September steigen Technologieaktien wie Nvidia und auch Bitcoin, während Gold und Tesla nachgeben. Keine der Expertenmeinungen hat in jedem Punkt recht behalten. Das zeigt zum Abschluss des Spiels: Weder Fachleute noch du konntet die Kursentwicklung sicher vorhersagen. Das ist an echten Finanzmärkten nicht anders.'}
];
const STORAGE_KEY = 'planspiel-boerse-2026-v1';
const money = value => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Math.abs(value)<0.000001 ? 0 : value);
const percent = value => `${value >= 0 ? '+' : ''}${(value*100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} %`;
const escaped = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const totalValue = holdings => sum(ASSETS.map(asset => holdings[asset.id]));
const monthlyReturn = (id,step) => step ? PRICES[id][step]/PRICES[id][step-1]-1 : 0;
const $ = id => document.getElementById(id);
function freshState() {
  const holdings = {...zeroHoldings(),cash:500};
  return {version:1,phase:'intro',step:0,holdings,costBasis:zeroHoldings(),targets:{...holdings},fees:0,income:0,spent:0,history:[],snapshots:[{step:0,value:500,adjusted:500}],note:'',reflections:['','',''],selected:[],initial:null,unpaid:0};
}
let storageAvailable = true;
let state = freshState();
try {
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (stored && stored.version === 1 && Number.isInteger(stored.step) && stored.step >= 0 && stored.step <= 12 &&
      ['intro','setup','start','decision','review','end'].includes(stored.phase) && ASSETS.every(asset => Number.isFinite(stored.holdings?.[asset.id]) && stored.holdings[asset.id] >= -0.000001) &&
      Array.isArray(stored.history) && Array.isArray(stored.snapshots) && Array.isArray(stored.reflections) && Array.isArray(stored.selected) &&
      stored.targets && ['fees','income','spent','unpaid'].every(key => Number.isFinite(stored[key]) && stored[key] >= 0) &&
      (stored.phase !== 'decision' || stored.step < 12) && (stored.phase !== 'review' || stored.step > 0)) {
    state = stored;
    state.targets = Object.fromEntries(ASSETS.map(asset => [asset.id,
      Number.isFinite(stored.targets[asset.id]) && stored.targets[asset.id] >= 0 ? stored.targets[asset.id] : stored.holdings[asset.id]]));
  }
} catch { storageAvailable = false; }
restoreCostBasis(state);
function save() {
  try {
    const targets = Object.fromEntries(ASSETS.map(asset => [asset.id,
      Number.isFinite(state.targets[asset.id]) ? state.targets[asset.id] : state.holdings[asset.id]]));
    localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,targets})); storageAvailable=true;
  }
  catch { storageAvailable=false; }
  $('save-status').textContent = storageAvailable ? 'Spielstand auf diesem Gerät gespeichert' : 'Speichern nicht verfügbar. Seite geöffnet lassen.';
}
function currentEvent() { return EVENTS[Math.min(state.step,11)]; }
function cashflow() { return state.phase === 'decision' ? currentEvent().flow || 0 : 0; }
function currentQuote() { return quoteTrade(state.holdings,state.targets,cashflow()); }
function netLiquidation() {
  return state.holdings.cash + sum(ASSETS.slice(1).map(asset => Math.max(0,state.holdings[asset.id] -
    (asset.id === 'fixed' ? 50 : asset.id === 'gold' ? state.holdings[asset.id]*0.02 : asset.fee))));
}
function newsHTML(event) {
  return `<article class="news ${event.flow ? 'liquidity' : ''}"><span class="tag">${event.category}</span>
    <h2>${event.title}</h2><p>${event.text}</p>
    <div class="evidence"><div class="figure">${event.figure}</div><div class="caption">${event.caption}</div></div>
    <p class="small muted">${event.url ? `Nachricht vom ${new Date(event.date+'T12:00:00').toLocaleDateString('de-DE')}` : 'Fiktives Ereignis für dieses Planspiel.'}</p>
    <div class="question"><strong>Deine Abwägung</strong>${event.question}</div></article>`;
}

function assetsHTML() {
  const maximum = Math.ceil(Math.max(0,totalValue(state.holdings)+cashflow())*100)/100;
  return `<div class="section-heading"><h2>Deine Aufteilung</h2><button data-action="reset-targets">Änderungen zurücksetzen</button></div>
    <div class="asset-grid">${ASSETS.map(asset => `<article class="asset" style="--asset:${asset.color}">
    <div class="asset-header"><div><h3>${asset.name}</h3><span class="ticker">${asset.ticker}</span></div><span class="eyebrow">${asset.id==='cash'?'Reserve':'EUR'}</span></div>

    ${asset.id==='cash' ? `<div class="cash-value" id="cash-target">${money(currentQuote().holdings?.cash || 0)}</div><div class="current">Rest nach allen Käufen, Verkäufen und Gebühren</div>` :

function accountHTML() {

function lineChart(series, labels, title, unit) {
  const width=Math.max(300,$('market-chart').clientWidth),height=280,left=64,right=26,top=20,bottom=38;
  const values=series.flatMap(line=>line.values);
  if (!values.length) return '<p class="empty">Keine Anlage ausgewählt.</p>';
  const low=Math.min(...values), high=Math.max(...values), padding=Math.max((high-low)*0.12,2);
  const minimum=low-padding,maximum=high+padding;
  const plotWidth=width-left-right,plotHeight=height-top-bottom;
  const x=index=>left+index/Math.max(1,labels.length-1)*plotWidth;
  const y=value=>top+(maximum-value)/(maximum-minimum)*plotHeight;
  const grids=Array.from({length:5},(unused,index)=>{
    const value=minimum+(maximum-minimum)*index/4;
    return `<line x1="${left}" x2="${width-right}" y1="${y(value)}" y2="${y(value)}" stroke="#dce6df"/><text x="${left-10}" y="${y(value)+4}" text-anchor="end">${value.toLocaleString('de-DE',{maximumFractionDigits:0})}${unit}</text>`;
  }).join('');
  const linePaths=series.map(line=>`<polyline fill="none" stroke="${line.color}" stroke-width="2.8" vector-effect="non-scaling-stroke" points="${line.values.map((value,index)=>`${x(index)},${y(value)}`).join(' ')}"/>
    ${line.values.map((value,index)=>`<circle cx="${x(index)}" cy="${y(value)}" r="4" fill="${line.color}"><title>${line.name}, ${labels[index]}: ${value.toLocaleString('de-DE',{maximumFractionDigits:2})}${unit}</title></circle>`).join('')}`).join('');
  const stride=width<500?3:width<800?2:1;
  const labelText=labels.map((label,index)=>index===0 || index===labels.length-1 || (index%stride===0 && index<labels.length-2) ? `<text x="${x(index)}" y="${height-12}" text-anchor="${index===0?'start':index===labels.length-1?'end':'middle'}">${label}</text>`:'').join('');
  return `<svg class="chart" style="aspect-ratio:${width}/${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}"><title>${title}</title>${grids}${linePaths}${labelText}</svg>`;
}
function drawCharts() {

  const net=sum((quote.trades||[]).map(trade=>trade.delta));
  $('preview-net').textContent=money(-net);

  $('order-error').textContent=quote.error;

  ASSETS.slice(1).forEach(asset=>{

function confirmOrder() {
  if (!['setup','decision'].includes(state.phase)) return;
  const quote=currentQuote();
  if (!quote.valid) return;
  const before=totalValue(state.holdings);
  const flow=cashflow();
  const execution=trackTrades(state.holdings,state.costBasis,quote.trades);
  state.costBasis=execution.costBasis;
  quote.trades=execution.trades;
  state.holdings=quote.holdings;
  state.holdings.cash=Math.max(0,state.holdings.cash);
  state.fees+=quote.fees;
  if (state.phase==='setup') {
    state.initial={holdings:{...state.holdings},trades:quote.trades,fees:quote.fees,note:state.note};
    state.selected=ASSETS.filter(asset=>state.holdings[asset.id]>0.000001).map(asset=>asset.id);
    state.snapshots[0]={step:0,value:totalValue(state.holdings),adjusted:totalValue(state.holdings),twr:totalValue(state.holdings)/500-1};
    state.phase='start';
  } else {
    if (flow>0) state.income+=flow;
    if (flow<0) state.spent-=flow;
    const afterTrade=totalValue(state.holdings);
    const step=state.step+1;
    ASSETS.forEach(asset=>{state.holdings[asset.id]*=1+monthlyReturn(asset.id,step);});
    const endValue=totalValue(state.holdings);
    const periodReturn=before+flow>0?endValue/(before+flow)-1:0;
    const previous=state.snapshots[state.snapshots.length-1].twr||0;
    const twr=(1+previous)*(1+periodReturn)-1;
    state.history.push({step,fees:quote.fees,flow,trades:quote.trades,note:state.note,
      marketGain:endValue-afterTrade,marketReturn:afterTrade>0?endValue/afterTrade-1:0,endValue,holdings:{...state.holdings},twr});
    state.step=step;
    state.snapshots.push({step,value:endValue,adjusted:endValue-state.income+state.spent,twr});
    state.phase='review';
  }
  state.targets={...state.holdings};state.note='';
  render();focusHeading();
}

    updatePreview();save();
  }
  if(target.id==='decision-note') {state.note=target.value;save();}
  if(target.dataset.reflection!==undefined) {state.reflections[Number(target.dataset.reflection)]=target.value;save();}
});
document.addEventListener('change',event=>{
  const target=event.target;
  if(target.dataset.chart) {
    state.selected=target.checked?[...new Set([...state.selected,target.dataset.chart])]:state.selected.filter(id=>id!==target.dataset.chart);
    drawCharts();save();
  }
});
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button) return;
  const action=button.dataset.action;
  if(action==='begin' && state.phase==='intro') {state.phase='setup';render();focusHeading();}
  if(action==='begin-year' && state.phase==='start') {state.phase='decision';render();focusHeading();}
  if(action==='flyer') showDialog('Dein Bankflyer',flyerHTML());
  if(action==='confirm') confirmOrder();
  if(action==='next') nextRound();
  if(action==='rules') showRules();
  if(action==='sources') showSources();
  if(action==='close-dialog') $('info-dialog').close();
  if(action==='reset-targets') {state.targets={...state.holdings};render();}
  if(action==='restart') showDialog('Neu anfangen?',`<p>Dein aktueller Spielstand auf diesem Gerät wird gelöscht.</p><div class="end-actions"><button data-action="close-dialog">Abbrechen</button><button class="primary" data-action="confirm-restart">Neues Spiel starten</button></div>`);
  if(action==='confirm-restart') {$('info-dialog').close();state=freshState();render();focusHeading();}
  if(action==='insolvent' && state.phase==='decision' && currentEvent().flow<0 && netLiquidation()+currentEvent().flow<0) {state.unpaid=-currentEvent().flow;state.phase='end';render();focusHeading();}
  if(action==='print') window.print();
});
window.addEventListener('resize',drawCharts);
render();
</script>
</body>
</html>
